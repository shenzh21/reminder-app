<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定时提醒</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>⏰</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "微软雅黑", "Segoe UI", sans-serif;
    background: #E8ECF5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 500px;
    background: #F0F4FF;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    overflow: hidden;
  }

  /* ── 标题栏 ── */
  .title-bar {
    background: #4A90D9;
    color: white;
    text-align: center;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
  }

  /* ── 设置区域 ── */
  .setting-area {
    padding: 16px 20px;
  }
  .row {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .row label {
    font-size: 14px;
    white-space: nowrap;
    min-width: 70px;
  }
  .row input[type="number"] {
    width: 56px;
    padding: 6px 4px;
    font-size: 16px;
    text-align: center;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
  }
  .row input[type="number"]:focus {
    border-color: #4A90D9;
    box-shadow: 0 0 4px rgba(74,144,217,0.3);
  }
  .time-sep {
    font-size: 20px;
    font-weight: bold;
    color: #333;
  }
  .row select {
    padding: 6px 8px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    background: white;
  }
  .row select:focus {
    border-color: #4A90D9;
  }
  .msg-input {
    flex: 1;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    min-width: 0;
  }
  .msg-input:focus {
    border-color: #4A90D9;
    box-shadow: 0 0 4px rgba(74,144,217,0.3);
  }
  .add-btn {
    width: 100%;
    padding: 10px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    background: #4A90D9;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .add-btn:hover { background: #2C5F9E; }
  .add-btn:active { background: #1E4A7A; }

  /* ── 分隔线 ── */
  .divider {
    height: 1px;
    background: #D0D8E8;
    margin: 0 20px;
  }

  /* ── 列表区域 ── */
  .list-header {
    padding: 12px 20px 6px;
    font-size: 16px;
    font-weight: bold;
  }
  .list-container {
    min-height: 80px;
    max-height: 380px;
    overflow-y: auto;
    padding: 6px 20px 14px;
  }
  .list-container::-webkit-scrollbar { width: 6px; }
  .list-container::-webkit-scrollbar-thumb { background: #C0C8D8; border-radius: 3px; }

  .empty-hint {
    text-align: center;
    color: #999;
    padding: 30px 0;
    font-size: 14px;
  }

  /* ── 提醒条目 ── */
  .reminder-item {
    display: flex;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #FAFAFA;
    border-radius: 8px;
    border: 1px solid #E8ECF5;
    transition: opacity 0.2s;
  }
  .reminder-item.disabled {
    opacity: 0.5;
    background: #F0F0F0;
  }
  .reminder-info {
    flex: 1;
    min-width: 0;
  }
  .reminder-time {
    font-size: 15px;
    font-weight: bold;
    color: #333;
  }
  .reminder-item.disabled .reminder-time { color: #AAA; }
  .reminder-detail {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
  .reminder-msg {
    font-size: 13px;
    color: #555;
    margin-top: 3px;
    word-break: break-all;
  }
  .reminder-item.disabled .reminder-msg { color: #BBB; }

  .reminder-actions {
    display: flex;
    gap: 4px;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .act-btn {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    background: transparent;
  }
  .act-btn:hover { background: #E0E6F0; }
  .act-btn.toggle { color: #E6A817; }
  .act-btn.toggle.off { color: #4A90D9; }
  .act-btn.sound { font-size: 14px; }
  .act-btn.delete { color: #E74C3C; }
  .act-btn.delete:hover { background: #FDE8E8; }

  /* ── 底部状态栏 ── */
  .status-bar {
    background: #E8ECF5;
    text-align: center;
    padding: 8px;
    font-size: 11px;
    color: #888;
  }
  .notif-status {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    margin-left: 6px;
    cursor: pointer;
  }
  .notif-status.granted { background: #D4EDDA; color: #155724; }
  .notif-status.denied { background: #F8D7DA; color: #721C24; }
  .notif-status.default { background: #FFF3CD; color: #856404; }

  /* ── 弹窗 ── */
  .popup-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .popup-overlay.show { display: flex; }
  .popup-box {
    background: #F0F4FF;
    border-radius: 16px;
    width: 360px;
    max-width: 90vw;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    text-align: center;
    padding: 28px 24px 20px;
    animation: popIn 0.3s ease;
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .popup-icon { font-size: 48px; }
  .popup-msg {
    font-size: 18px;
    color: #333;
    margin: 12px 0 20px;
    word-break: break-all;
    line-height: 1.5;
  }
  .popup-btn {
    padding: 10px 36px;
    font-size: 15px;
    color: white;
    background: #4A90D9;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  .popup-btn:hover { background: #2C5F9E; }

  /* ── 响应式 ── */
  @media (max-width: 520px) {
    body { padding: 0; }
    .app { border-radius: 0; min-height: 100vh; }
    .list-container { max-height: none; flex: 1; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="title-bar">⏰ 定时提醒</div>

  <div class="setting-area">
    <div class="row">
      <label>提醒时间</label>
      <input type="number" id="inputHour" min="0" max="23" value="0">
      <span class="time-sep">:</span>
      <input type="number" id="inputMinute" min="0" max="59" value="0">
      <label style="min-width:auto;margin-left:10px;">重复</label>
      <select id="inputRepeat">
        <option value="null">仅一次</option>
        <option value="30">每30分钟</option>
        <option value="60">每1小时</option>
      </select>
    </div>
    <div class="row">
      <label>提醒内容</label>
      <input type="text" class="msg-input" id="inputMsg" placeholder="请输入提醒内容" maxlength="100">
    </div>
    <button class="add-btn" onclick="addReminder()">➕ 添加提醒</button>
  </div>

  <div class="divider"></div>

    <div class="list-header">⏰ 定时提醒</div>
  <div class="list-container" id="reminderList"></div>

  <div class="status-bar" id="statusBar">
    💡 保持页面打开以确保提醒正常触发 · 数据保存在浏览器本地
    <span id="notifBadge" class="notif-status default" onclick="requestNotifPermission()">通知: 待授权</span>
  </div>
</div>

<!-- 提醒弹窗 -->
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box">
    <div class="popup-icon">⏰</div>
    <div class="popup-msg" id="popupMsg"></div>
    <button class="popup-btn" onclick="closePopup()">知道了</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  全局状态
// ═══════════════════════════════════════════════════════
const STORAGE_KEY = 'timer_reminders_v1';
let reminders = [];
let idCounter = 0;
let checkerTimer = null;

// ═══════════════════════════════════════════════════════
//  持久化
// ═══════════════════════════════════════════════════════
function saveReminders() {
  const data = reminders.map(r => ({
    id: r.id,
    hour: r.hour,
    minute: r.minute,
    message: r.message,
    repeatInterval: r.repeatInterval,
    enabled: r.enabled,
    sound: r.sound,
    nextTrigger: r.nextTrigger ? r.nextTrigger : null,
  }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function loadReminders() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return false; // 首次使用

  try {
    const data = JSON.parse(raw);
    const now = Date.now();
    const loaded = [];

    for (const item of data) {
      let nextTrigger = item.nextTrigger ? new Date(item.nextTrigger) : null;

      // 一次性提醒已过期则跳过
      if (item.repeatInterval === null) {
        if (!nextTrigger || nextTrigger.getTime() <= now) continue;
      } else {
        // 重复提醒：如果下次触发已过，往后推
        if (nextTrigger && nextTrigger.getTime() <= now) {
          while (nextTrigger.getTime() <= now) {
            nextTrigger = new Date(nextTrigger.getTime() + item.repeatInterval * 60000);
          }
        }
      }

      loaded.push({
        id: item.id,
        hour: item.hour,
        minute: item.minute,
        message: item.message,
        repeatInterval: item.repeatInterval,
        enabled: item.enabled,
        sound: item.sound || false,
        nextTrigger: nextTrigger,
      });
      if (item.id > idCounter) idCounter = item.id;
    }
    reminders = loaded;
    return true;
  } catch (e) {
    return false;
  }
}

// ═══════════════════════════════════════════════════════
//  默认提醒（首次打开时生成）
// ═══════════════════════════════════════════════════════
function createDefaultReminders() {
  const now = new Date();

  // 番茄结束：xx:25 起，每30分钟
  const tomatoHour = now.getHours();
  const tomatoMinute = 25;
  let tomatoNext = new Date(now);
  tomatoNext.setHours(tomatoHour, tomatoMinute, 0, 0);
  while (tomatoNext.getTime() <= now.getTime()) {
    tomatoNext = new Date(tomatoNext.getTime() + 30 * 60000);
  }

  // 半点报时：xx:00 起，每30分钟
  const halfHour = now.getHours();
  const halfMinute = 0;
  let halfNext = new Date(now);
  halfNext.setHours(halfHour, halfMinute, 0, 0);
  while (halfNext.getTime() <= now.getTime()) {
    halfNext = new Date(halfNext.getTime() + 30 * 60000);
  }

  idCounter = 2;
  reminders = [
    {
      id: 1,
      hour: tomatoHour,
      minute: tomatoMinute,
      message: '番茄结束',
      repeatInterval: 30,
      enabled: true,
      sound: true,
      nextTrigger: tomatoNext,
    },
    {
      id: 2,
      hour: halfHour,
      minute: halfMinute,
      message: '半点报时',
      repeatInterval: 30,
      enabled: true,
      sound: true,
      nextTrigger: halfNext,
    },
  ];
  saveReminders();
}

// ═══════════════════════════════════════════════════════
//  计算下次触发时间
// ═══════════════════════════════════════════════════════
function computeNextTrigger(hour, minute, repeatInterval) {
  const now = new Date();
  const base = new Date(now);
  base.setHours(hour, minute, 0, 0);

  if (repeatInterval === null) {
    return base.getTime() > now.getTime() ? base : null;
  }

  let next = base;
  while (next.getTime() <= now.getTime()) {
    next = new Date(next.getTime() + repeatInterval * 60000);
  }
  return next;
}

// ═══════════════════════════════════════════════════════
//  CRUD 操作
// ═══════════════════════════════════════════════════════
function addReminder() {
  const hour = parseInt(document.getElementById('inputHour').value) || 0;
  const minute = parseInt(document.getElementById('inputMinute').value) || 0;
  const message = document.getElementById('inputMsg').value.trim();
  const repeatVal = document.getElementById('inputRepeat').value;
  const repeatInterval = repeatVal === 'null' ? null : parseInt(repeatVal);

  if (!message) {
    alert('请输入提醒内容！');
    return;
  }

  const h = Math.max(0, Math.min(23, hour));
  const m = Math.max(0, Math.min(59, minute));

  const nextTrigger = computeNextTrigger(h, m, repeatInterval);
  if (!nextTrigger) {
    alert('指定的时间已过，无法设置一次性提醒。');
    return;
  }

  idCounter++;
  reminders.push({
    id: idCounter,
    hour: h,
    minute: m,
    message,
    repeatInterval,
    enabled: true,
    sound: false,
    nextTrigger,
  });
  saveReminders();
  renderList();
  document.getElementById('inputMsg').value = '';
}

function deleteReminder(id) {
  reminders = reminders.filter(r => r.id !== id);
  saveReminders();
  renderList();
}

function toggleReminder(id) {
  for (const r of reminders) {
    if (r.id === id) {
      r.enabled = !r.enabled;
      if (r.enabled) {
        r.nextTrigger = computeNextTrigger(r.hour, r.minute, r.repeatInterval);
        if (!r.nextTrigger) {
          r.enabled = false; // 一次性提醒已过期
        }
      }
      break;
    }
  }
  saveReminders();
  renderList();
}

function toggleSound(id) {
  for (const r of reminders) {
    if (r.id === id) {
      r.sound = !r.sound;
      break;
    }
  }
  saveReminders();
  renderList();
}

// ═══════════════════════════════════════════════════════
//  渲染列表
// ═══════════════════════════════════════════════════════
function renderList() {
  const container = document.getElementById('reminderList');

  if (reminders.length === 0) {
    container.innerHTML = '<div class="empty-hint">暂无提醒</div>';
    return;
  }

  container.innerHTML = reminders.map(r => {
    const enabled = r.enabled;
    const repeatStr = r.repeatInterval === null ? '仅一次' : `每${r.repeatInterval}分钟`;
    let nextStr;
    if (!enabled) {
      nextStr = '已暂停';
    } else if (r.nextTrigger) {
      const d = new Date(r.nextTrigger);
      nextStr = `下次 ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } else {
      nextStr = '已过期';
    }

    return `
      <div class="reminder-item ${enabled ? '' : 'disabled'}">
        <div class="reminder-info">
          <div class="reminder-time">⏰ ${pad(r.hour)}:${pad(r.minute)}</div>
          <div class="reminder-detail">${repeatStr} · ${nextStr}</div>
          <div class="reminder-msg">${escHtml(r.message)}</div>
        </div>
        <div class="reminder-actions">
          <button class="act-btn delete" title="删除" onclick="deleteReminder(${r.id})">✕</button>
          <button class="act-btn sound" title="音效" onclick="toggleSound(${r.id})">${r.sound ? '🔔' : '🔕'}</button>
          <button class="act-btn toggle ${enabled ? '' : 'off'}" title="${enabled ? '暂停' : '恢复'}" onclick="toggleReminder(${r.id})">${enabled ? '⏸' : '▶'}</button>
        </div>
      </div>
    `;
  }).join('');
}

function pad(n) { return String(n).padStart(2, '0'); }
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ═══════════════════════════════════════════════════════
//  提醒弹窗
// ═══════════════════════════════════════════════════════
let currentAudioCtx = null;

function showPopup(message, sound) {
  document.getElementById('popupMsg').textContent = message;
  document.getElementById('popupOverlay').classList.add('show');

  if (sound) {
    playBeep();
  }

  // 发送浏览器通知
  sendNotification('⏰ 定时提醒', message);
}

function closePopup() {
  document.getElementById('popupOverlay').classList.remove('show');
}

function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value = 800;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.4);
    // 第二声
    const osc2 = ctx.createOscillator();
    const gain2 = ctx.createGain();
    osc2.connect(gain2);
    gain2.connect(ctx.destination);
    osc2.frequency.value = 1000;
    osc2.type = 'sine';
    gain2.gain.setValueAtTime(0.3, ctx.currentTime + 0.15);
    gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.55);
    osc2.start(ctx.currentTime + 0.15);
    osc2.stop(ctx.currentTime + 0.55);
  } catch (e) {}
}

// ═══════════════════════════════════════════════════════
//  后台检查器（每秒）
// ═══════════════════════════════════════════════════════
function checker() {
  const now = Date.now();
  let needSave = false;
  let needRender = false;
  const toRemove = [];

  for (const r of reminders) {
    if (!r.enabled) continue;
    if (!r.nextTrigger) { toRemove.push(r); continue; }

    if (now >= r.nextTrigger.getTime()) {
      showPopup(r.message, r.sound);

      if (r.repeatInterval === null) {
        toRemove.push(r);
      } else {
        r.nextTrigger = new Date(r.nextTrigger.getTime() + r.repeatInterval * 60000);
        needSave = true;
      }
      needRender = true;
    }
  }

  for (const r of toRemove) {
    reminders = reminders.filter(x => x.id !== r.id);
    needSave = true;
    needRender = true;
  }

  if (needSave) saveReminders();
  if (needRender) renderList();
}

// ═══════════════════════════════════════════════════════
//  通知权限管理
// ═══════════════════════════════════════════════════════
//  通知权限管理
// ═══════════════════════════════════════════════════════
async function initNotifications() {
  if (!('Notification' in window)) {
    updateNotifBadge('unsupported');
    return;
  }

  if (Notification.permission === 'default') {
    await Notification.requestPermission();
  }

  updateNotifBadge();
}

function updateNotifBadge(status) {
  const badge = document.getElementById('notifBadge');
  if (!badge) return;

  const perm = status || Notification.permission;

  badge.className = 'notif-status';

  if (perm === 'granted') {
    badge.classList.add('granted');
    badge.textContent = '🔔 通知已开启';
    badge.style.cursor = 'default';
    badge.onclick = null;
  } else if (perm === 'denied') {
    badge.classList.add('denied');
    badge.textContent = '🔕 通知被拒绝';
    badge.style.cursor = 'pointer';
    badge.onclick = () => {
      alert('通知被拒绝，请手动开启：\n\n方法1：点击地址栏左侧 🔒 → 通知 → 允许\n\n方法2：浏览器设置 → 隐私 → 网站设置 → 通知 → 允许');
    };
  } else if (perm === 'unsupported') {
    badge.classList.add('denied');
    badge.textContent = '通知: 不支持';
    badge.style.cursor = 'default';
    badge.onclick = null;
  } else {
    badge.classList.add('default');
    badge.textContent = '🔔 授权通知';
    badge.style.cursor = 'pointer';
    badge.onclick = () => Notification.requestPermission().then(updateNotifBadge);
  }
}

// 发送通知
function sendNotification(title, body) {
  if (!('Notification' in window)) return false;

  if (Notification.permission === 'granted') {
    try {
      const notif = new Notification(title, {
        body: body,
        icon: '🔔',
        tag: 'reminder-' + Date.now(),
        requireInteraction: false
      });
      setTimeout(() => notif.close(), 5000);
      return true;
    } catch (e) {
      return false;
    }
  }
  return false;
}

// ═══════════════════════════════════════════════════════
//  初始化
// ═══════════════════════════════════════════════════════
async function init() {
  await initNotifications();

  // 设置默认时间为当前时间
  const now = new Date();
  document.getElementById('inputHour').value = now.getHours();
  document.getElementById('inputMinute').value = now.getMinutes();

  // 加载数据，首次使用则创建默认提醒
  const loaded = loadReminders();
  if (!loaded || reminders.length === 0) {
    createDefaultReminders();
  }

  renderList();

  // 启动检查器
  checkerTimer = setInterval(checker, 1000);

  // 页面标题闪烁（提醒时）
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      document.title = '⏰ 定时提醒';
    }
  });
}

// 回车添加提醒
document.addEventListener('keydown', (e) => {
